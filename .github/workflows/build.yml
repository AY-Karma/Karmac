name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compile, check, and package
        shell: powershell
        run: |
          .\package.ps1
          .\tools\Verify-AppIcon.ps1
      - name: Check release integrity rejection paths
        shell: powershell
        run: .\tools\Test-ReleaseVerification.ps1
      - name: Upload portable app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Karmac-Windows-x64
          path: |
            artifacts/Karmac-Windows-x64.zip
            artifacts/SHA256SUMS.txt
            artifacts/release.json
            artifacts/release-notes.md
          if-no-files-found: error
