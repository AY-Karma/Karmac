name: Prepare draft release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v1.0.0-preview.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Validate tag and build release
        shell: powershell
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw 'Invalid version tag.' }
          .\package.ps1 -Version $env:RELEASE_TAG.Substring(1)
          .\tools\Test-ReleaseVerification.ps1
      - name: Create draft for maintainer review
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $releaseArguments = @('release','create',$env:RELEASE_TAG,'--verify-tag','--draft','--latest=false',
            '--title',('Karmac ' + $env:RELEASE_TAG),'--notes-file','artifacts/release-notes.md',
            'artifacts/Karmac-Windows-x64.zip','artifacts/SHA256SUMS.txt','artifacts/release.json')
          if ($env:RELEASE_TAG.Contains('-')) { $releaseArguments += '--prerelease' }
          & gh @releaseArguments
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed.' }
